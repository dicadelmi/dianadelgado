<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armstrong Watson Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Google+Sans+Flex:opsz,wght@6..144,300;6..144,400;6..144,500;6..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A;
    --gold:#C9A24B;
    --white:#FFFFFF;
    --grey:#8A8A8A;
    --line:#ECECEC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--white);
    color:var(--black);
    font-family:'Google Sans Flex','Google Sans',Inter,Arial,sans-serif;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}


  main{
    max-width:1400px;
    margin:0 auto;
    padding:0;
  }

  .full-img{
    display:block;
    width:100%;
    height:auto;
  }

  .row-pair{
    display:flex;
    width:100%;
  }
  .row-pair img{
    display:block;
    width:50%;
    height:auto;
    object-fit:cover;
  }

  @media(max-width:640px){
    .row-pair{flex-direction:column;}
    .row-pair img{width:100%;}
  }


  /* NAV */
  header{padding:96px 0 20px;}
  .header-wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  .nav-row{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;}
  .header-icons{display:flex;align-items:flex-end;gap:22px;}
  .icons-wrap{position:relative;display:flex;align-items:flex-end;}
  .header-icons a{display:flex;align-items:flex-end;justify-content:center;opacity:.75;transition:opacity .25s ease;}
  .header-icons a:hover{opacity:1;}
  .header-icons img{display:block;}
  nav{text-align:left;position:relative;}
  nav ul{display:flex;align-items:flex-end;gap:28px;list-style:none;font-size:12px;line-height:1;font-weight:500;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;margin-right:auto;position:relative;top:2px;}
  nav a:hover{color:var(--black);}

  /* MOBILE BURGER */
  .nav-burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:24px;height:18px;cursor:pointer;background:none;border:none;padding:0;}
  .nav-burger span{display:block;width:100%;height:2px;background:var(--grey);border-radius:1px;transition:transform .25s ease,opacity .25s ease;}
  .nav-burger.active span:nth-child(1){transform:translateY(8px) rotate(45deg);}
  .nav-burger.active span:nth-child(2){opacity:0;}
  .nav-burger.active span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  .project-hero{padding:24px 0 0;}
  .project-tag{margin-top:28px;font-size:13px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);}
  .project-title{margin-top:10px;font-size:clamp(32px,5vw,54px);font-weight:600;letter-spacing:-0.02em;max-width:820px;}
  main{margin-top:40px;}

  /* PROJECT NAV */
  .project-nav{border-top:1px solid var(--line);padding:32px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;}
  .project-nav a{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);transition:color .2s ease;}
  .project-nav a:hover{color:var(--black);}
  .project-nav .next{text-align:right;justify-content:flex-end;}

  footer{background:var(--black);padding:34px 0;font-size:12px;color:#8a8a8a;text-align:center;}
  .social-row{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin-bottom:34px;}
  .social-row a{opacity:.75;transition:opacity .25s ease;display:inline-flex;align-items:flex-end;justify-content:center;}
  .social-row a:hover{opacity:1;}
  .social-row img{display:block;}

  @media(max-width:640px){
    .wrap{padding:0 20px;}
    .header-wrap{padding:0 20px;}
    .header-icons{display:none;}
    .nav-burger{display:flex;}
    .icons-wrap.open .header-icons{
      display:flex;gap:16px;
      position:absolute;top:32px;right:0;
      background:var(--white);padding:14px 16px;
      box-shadow:0 12px 28px rgba(0,0,0,.10);
      border-radius:6px;z-index:30;
    }
    .project-title{white-space:nowrap;font-size:clamp(16px,calc((100vw - 40px) / 16.5),40px);}
    .project-nav{flex-direction:column;align-items:flex-start;gap:14px;}
    .project-nav .next{text-align:left;}
  }
</style>
</head>
<body>

<header>
  <div class="header-wrap nav-row">
    <nav>
      <ul>
      <li><a href="https://dianadelgado.uk">Works</a></li>
      <li><a href="../index.html#about">Bio</a></li>
    </ul></nav>
    <div class="icons-wrap">
      <button class="nav-burger" id="iconsBurger" aria-label="Toggle icons" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="header-icons" id="headerIcons">
      <a href="https://www.behance.net/DianaDelgado" aria-label="Behance" target="_blank" rel="noopener"><img src="images/img-01.png" alt="" style="width:20.8px;height:13.8px;"></a>
      <a href="https://uk.linkedin.com/in/diana-delgado25" aria-label="LinkedIn" target="_blank" rel="noopener"><img src="images/img-02.png" alt="" style="width:16.8px;height:16.8px;"></a>
      <a href="mailto:dicadelmi@hotmail.com" aria-label="Email"><img src="images/img-03.png" alt="" style="width:18.2px;height:15.5px;"></a>
    </div>
    </div>
  </div>
</header>

<section class="project-hero">
  <div class="wrap">
    <div class="project-tag">PRINT &amp; EDITORIAL</div>
    <h1 class="project-title">Armstrong Watson Ads</h1>
  </div>
</section>


<main>
<div class="wrap">
  <img class="full-img" src="images/1.jpg" alt="Armstrong Watson Ads">
  <img class="full-img" src="images/2.jpg" alt="Armstrong Watson Ads">
  <img class="full-img" src="images/3.jpg" alt="Armstrong Watson Ads">
  <img class="full-img" src="images/4.jpg" alt="Armstrong Watson Ads">
  <img class="full-img" src="images/5.jpg" alt="Armstrong Watson Ads">
  <img class="full-img" src="images/6.jpg" alt="Armstrong Watson Ads">
</div>
</main>

<div class="wrap">
  <div class="project-nav">
    <a href="../caribwiin-brochure/"><svg width="7" height="11" viewBox="0 0 7 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 1L1.5 5.5L6 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> CaribWiin Brochure</a>
    <a href="../multi-creative-projects/" class="next">Multi-Creative Projects <svg width="7" height="11" viewBox="0 0 7 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L5.5 5.5L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
</div>

<footer id="contact">
  <div class="social-row">
    <a href="https://www.behance.net/DianaDelgado" aria-label="Behance" target="_blank" rel="noopener"><img src="images/img-17.png" alt="" style="width:13px;height:8.6px;"></a>
    <a href="https://uk.linkedin.com/in/diana-delgado25" aria-label="LinkedIn" target="_blank" rel="noopener"><img src="images/img-18.png" alt="" style="width:10.5px;height:10.5px;"></a>
    <a href="mailto:dicadelmi@hotmail.com" aria-label="Email"><img src="images/img-19.png" alt="" style="width:11.4px;height:9.7px;"></a>
  </div>
  © 2026 Diana Delgado
</footer>


<script>
  // mobile burger menu (toggles the social icons)
  const iconsBurger = document.getElementById('iconsBurger');
  const iconsWrap = iconsBurger.closest('.icons-wrap');
  iconsBurger.addEventListener('click', () => {
    const isOpen = iconsWrap.classList.toggle('open');
    iconsBurger.classList.toggle('active', isOpen);
    iconsBurger.setAttribute('aria-expanded', isOpen);
  });
  document.querySelectorAll('.header-icons a').forEach(link => {
    link.addEventListener('click', () => {
      iconsWrap.classList.remove('open');
      iconsBurger.classList.remove('active');
      iconsBurger.setAttribute('aria-expanded', 'false');
    });
  });
</script>
</body>
</html>
